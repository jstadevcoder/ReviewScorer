[project]
name = "ReviewScorer"
version = "1.0.0"
description = "" #TODO: Add a short description of your package
authors = [{name = "Your Name", email = "your@email.com"}] #TODO: Add your name and email
requires-python = ">=3.12"
dynamic = ["optional-dependencies"]
dependencies = [
    "anthropic>=0.116.0",
    "asyncio>=4.0.0",
    "debugpy>=1.8.21",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "mcp>=1.28.1",
    "numpy>=2.5.2",
    "openai>=2.45.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
    "structlog>=26.1.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
optional-dependencies = {dev = {file = ["dev-requirements.txt"]}} # add packages for development in the dev-requirements.txt file

[project.scripts]
# TODO: add your CLI entry points here

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"




